<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Заявка на кредит</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --alfa-red: #EF3124;
            --alfa-black: #000000;
            --alfa-white: #FFFFFF;
            --alfa-platinum: #F3F4F6;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--alfa-platinum); margin: 0; padding: 40px; }
        .container { max-width: 700px; margin: auto; background: var(--alfa-white); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 40px; }
        h1 { color: var(--alfa-black); font-weight: 700; margin-bottom: 10px; }
        .subtitle { color: #666; margin-bottom: 30px; }
        .section-title { font-weight: 600; font-size: 18px; margin-top: 30px; margin-bottom: 15px; border-bottom: 2px solid var(--alfa-red); padding-bottom: 8px; display: inline-block; }
        .form-row { display: flex; gap: 20px; margin-bottom: 20px; }
        .form-group { flex: 1; display: flex; flex-direction: column; }
        label { margin-bottom: 8px; font-weight: 600; font-size: 14px; color: var(--alfa-black); }
        input, select { padding: 12px; border: 2px solid #E5E7EB; border-radius: 10px; font-family: 'Inter', sans-serif; font-size: 16px; transition: border-color 0.2s; }
        input:focus, select:focus { outline: none; border-color: var(--alfa-red); }
        button { width: 100%; padding: 16px; background-color: var(--alfa-red); color: var(--alfa-white); border: none; border-radius: 10px; font-size: 18px; font-weight: 600; cursor: pointer; margin-top: 30px; transition: background-color 0.2s; }
        button:hover { background-color: #d12a1e; }
        .error { color: var(--alfa-red); background: #FEF2F2; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Кредит наличными</h1>
        <p class="subtitle">Заполните заявку, и мы примем решение за 2 минуты.</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form action="/submit-application" method="post">
            <div class="section-title">Параметры кредита</div>
            <div class="form-row">
                <div class="form-group">
                    <label for="amount">Сумма кредита (₽)</label>
                    <input type="number" id="amount" name="amount" min="30000" max="30000000" placeholder="Например, 500 000" required>
                </div>
                <div class="form-group">
                    <label for="term">Срок (месяцев)</label>
                    <select id="term" name="term" required>
                        <option value="6">6 месяцев</option>
                        <option value="12">1 год</option>
                        <option value="24">2 года</option>
                        <option value="36">3 года</option>
                        <option value="60">5 лет</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="purpose">Цель кредита</label>
                <input type="text" id="purpose" name="purpose" placeholder="Например, на развитие бизнеса" required>
            </div>

            <div class="section-title">Контактные данные</div>
            <div class="form-group">
                <label for="full_name">Фамилия, имя и отчество</label>
                <input type="text" id="full_name" name="full_name" placeholder="Иванов Иван Иванович" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="phone">Мобильный телефон</label>
                    <input type="tel" id="phone" name="phone" placeholder="+7 (900) 000-00-00" required>
                </div>
                <div class="form-group">
                    <label for="email">Электронная почта</label>
                    <input type="email" id="email" name="email" placeholder="ivan@example.com" required>
                </div>
            </div>

            <button type="submit">Отправить заявку</button>
        </form>
    </div>
</body>
</html>
